# Checks the routes Sources requests against the API reference on staging: the contract check
# (Tests/IntrospectionSDKTests/APIContractTests.swift) compares them with the x-introspection
# flags of both OpenAPI documents.
#
# - On a pull request, a called /v1 route in neither document fails: that is the SDK's own fault.
#   Operations flagged for sdk that Sources never calls are only listed in the job summary, so a
#   new cloud route does not block an unrelated pull request.
# - introspection-cloud sends repository_dispatch api-reference-deployed after each staging deploy
#   (client_payload.sha is the cloud commit). That run and a manual one fail on both, and tell
#   #main-build-alerts when the state changes (clean to drift, drift to clean).
#
# A 404 for either document skips the run green, without a post or a recorded state; any other
# fetch error fails it.
name: API Contract

on:
  pull_request:
  repository_dispatch:
    types: [api-reference-deployed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    name: API reference on staging
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.probe.outputs.published }}
    steps:
      - name: Probe both documents
        id: probe
        run: |
          published=true
          for plane in controlplane dataplane; do
            url="https://api.staging.introspection.dev/openapi/${plane}.json"
            code="$(curl -sS -o "${RUNNER_TEMP}/${plane}.json" -w '%{http_code}' --max-time 30 "${url}")"
            case "${code}" in
              404) published=false ;;
              200) jq -e 'type == "object"' "${RUNNER_TEMP}/${plane}.json" >/dev/null \
                || { echo "::error::${url} is not a JSON object"; exit 1; } ;;
              *) echo "::error::${url} answered HTTP ${code}"; exit 1 ;;
            esac
          done
          if [ "${published}" = false ]; then echo "reference not published on staging yet, skipping"; fi
          echo "published=${published}" >> "${GITHUB_OUTPUT}"

  check:
    name: SDK vs API reference (staging)
    needs: reference
    if: needs.reference.outputs.published == 'true'
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7

      - name: Run the contract check
        env:
          INTROSPECTION_API_CONTRACT: "1"
          INTROSPECTION_API_CONTRACT_MISSING: ${{ github.event_name == 'pull_request' && 'report' || 'fail' }}
        run: INTROSPECTION_API_CONTRACT_REPORT="${PWD}/contract-report.txt" swift test --filter APIContractTests

      - name: Job summary
        if: always()
        run: |
          if [ -f contract-report.txt ]; then
            { echo '```'; cat contract-report.txt; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - uses: actions/upload-artifact@v7
        if: always() && github.event_name != 'pull_request'
        with:
          name: contract-report
          path: contract-report.txt
          if-no-files-found: ignore

  notify:
    name: Alert on a state change
    needs: [reference, check]
    # A check that wrote no report (staging down, a crash) makes the download fail: an outage is
    # not drift, so it neither posts nor records a state.
    if: >-
      always() && github.event_name != 'pull_request' && needs.reference.outputs.published == 'true'
      && (needs.check.result == 'success' || needs.check.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: contract-report
          path: ${{ runner.temp }}/check

      # The state of the last real post. Caches are immutable, so each post saves under a new
      # key and the newest one is restored by prefix.
      - name: Restore the last posted state
        uses: actions/cache/restore@v5
        with:
          path: .api-drift-state
          key: api-drift-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: api-drift-state-

      - name: Notify #main-build-alerts
        id: notify
        env:
          REPORT: ${{ runner.temp }}/check/contract-report.txt
          STATE_DIR: .api-drift-state
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_WEBHOOK_URL: ${{ secrets.MAIN_STATUS_SLACK_WEBHOOK_URL }}
        run: scripts/api-drift-notify.sh

      - name: Save the posted state
        if: steps.notify.outputs.posted == 'true'
        uses: actions/cache/save@v5
        with:
          path: .api-drift-state
          key: api-drift-state-${{ github.run_id }}-${{ github.run_attempt }}
