name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  INTROSPECTION_SDK_WARNINGS_AS_ERRORS: "1"

jobs:
  # Whether anything besides top-level Markdown changed: DocC articles under Sources still
  # run the documentation build. A workflow-level paths-ignore would leave All green pending.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!*.md"

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    environment: build
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  lint-actions:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: raven-actions/actionlint@v2

  lint:
    name: Format & Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7
      - name: swift format lint
        run: scripts/lint.sh

  swiftlint:
    name: SwiftLint (complexity & size)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # mise installs the static SwiftLint binary pinned in .mise.toml, which needs no toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          cache: true
      - name: swiftlint
        run: scripts/swiftlint.sh

  duplicates:
    name: Duplicate Code
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs Node.js and jscpd at the versions in mise.lock.
      - uses: jdx/mise-action@v5
        with:
          cache: true
      - name: jscpd (no clones allowed)
        run: scripts/duplicates.sh

  linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    needs: lint
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .build
          key: linux-swift-6.4-${{ hashFiles('Package.swift', 'Package.resolved') }}
      # INTROSPECTION_SDK_WARNINGS_AS_ERRORS makes warnings errors, the counterpart of clippy -D warnings.
      - name: Build (all traits)
        run: swift build --build-tests --enable-all-traits
      - name: Tests with coverage floor (all traits, including Telemetry)
        run: scripts/coverage.sh --enable-all-traits
      # The default build must not resolve or build the OpenTelemetry packages.
      - name: Tests (default traits)
        run: swift test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.txt
          if-no-files-found: ignore

  apple:
    name: Tests (Apple platforms)
    runs-on: macos-26
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build (all traits)
        run: swift build --build-tests --enable-all-traits
      - name: Tests
        run: swift test
      - name: Tests (all traits, including Telemetry)
        run: swift test --enable-all-traits
      # The Keychain storage and the hosted-login sheet compile only here.
      - name: Build for iOS
        run: |
          xcodebuild build -scheme IntrospectionSDK \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
      # Broken symbol links in documentation comments fail here, like cargo doc -D warnings.
      - name: Build documentation
        run: |
          xcodebuild docbuild -scheme IntrospectionSDK \
            -destination 'generic/platform=macOS' \
            OTHER_DOCC_FLAGS="--warnings-as-errors"

  api-breakage:
    name: API Breakage
    if: github.event_name == 'pull_request'
    # macOS so the Apple-only public API (Keychain, hosted login) is compared too.
    runs-on: macos-26
    needs: lint
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # The baseline is the PR's base commit, not the latest tag: main may already hold
      # intentional breaks that are not released yet, and only this PR's breakage matters.
      # A PR titled `type!:` or with a `BREAKING CHANGE:` footer declares the break and passes.
      # Title and body are read live, since a re-run reuses the event payload of the first run.
      - name: Diagnose API-breaking changes against the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if scripts/api-breakage.sh "$BASE_SHA"; then
            exit 0
          fi
          title="$(gh pr view "$PR_NUMBER" --json title --jq .title)"
          body="$(gh pr view "$PR_NUMBER" --json body --jq .body)"
          if printf '%s\n' "$title" | grep -Eq '^[a-z]+(\([^)]*\))?!:' ||
            printf '%s\n' "$body" | grep -Eq '^BREAKING[ -]CHANGE:'; then
            echo "::notice::The PR declares a breaking change, so the breakage above is intended."
            exit 0
          fi
          echo "::error::The public API broke. Fix it, or mark the PR title with '!' (see AGENTS.md)."
          exit 1

  all-green:
    name: All green
    if: always()
    needs:
      - changes
      - secrets-scan
      - lint-actions
      - lint
      - swiftlint
      - duplicates
      - linux
      - apple
      - api-breakage
    runs-on: ubuntu-latest
    steps:
      # A skip is allowed only by design: everything after Changes on a Markdown-only change,
      # and API Breakage outside pull requests. Any other skip fails, like a failure.
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: >-
            ${{ needs.changes.outputs.code != 'true' && 'lint, swiftlint, duplicates, linux, apple, api-breakage'
            || github.event_name != 'pull_request' && 'api-breakage' || '' }}
