name: Release Please

# Maintains the release PR (changelog + version bump) and, when it merges, cuts
# the vX.Y.Z tag and GitHub Release. Swift Package Manager resolves releases
# straight from those tags, so there is no separate publish step.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: build
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }} # variable, not secret: app IDs aren't sensitive
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
