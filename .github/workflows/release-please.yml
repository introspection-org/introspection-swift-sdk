name: Release Please

# Maintains the release PR (changelog + version bump) and, when it merges, cuts
# the vX.Y.Z tag and GitHub Release. Swift Package Manager resolves releases
# straight from those tags, so there is no separate publish step.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: build
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }} # variable, not secret: app IDs aren't sensitive
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # CI pushes the walk executable for every main commit; a release only adds its tag to that image.
  # CI may still be building the release commit, so wait for it.
  walk-tag:
    name: Tag introspection-walk with the release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      packages: write
    steps:
      - uses: oras-project/setup-oras@v2
        with:
          version: 1.3.6
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the release commit's image, then tag it
        env:
          WALK_IMAGE: ghcr.io/introspection-org/introspection-swift-walk
          SHA: ${{ needs.release-please.outputs.sha }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          deadline=$((SECONDS + 45 * 60))
          until err="$(oras resolve "$WALK_IMAGE:$SHA" 2>&1 >/dev/null)"; do
            if ((SECONDS >= deadline)); then
              echo "::error::$WALK_IMAGE:$SHA did not appear within 45 minutes, so $TAG is not tagged: $err"
              exit 1
            fi
            sleep 30
          done
          oras tag "$WALK_IMAGE:$SHA" "$TAG"
