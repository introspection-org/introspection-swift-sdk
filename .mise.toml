# Developer tools other than Swift, installed with `mise install`; versions and checksums are pinned in mise.lock.
[tools]
node = "22"
"npm:jscpd" = "5.4.1"

[tools."github:realm/SwiftLint"]
version = "0.65.1"
# The Linux archive also ships a fully static build, which needs no Swift toolchain;
# the dynamic one moves aside first, since mise never renames onto an existing file.
platforms.linux-x64 = { asset_pattern = "swiftlint_linux_amd64.zip", rename_exe = { "swiftlint" = "swiftlint-dynamic", "swiftlint-static" = "swiftlint" }, filter_bins = "swiftlint" }
platforms.linux-arm64 = { asset_pattern = "swiftlint_linux_arm64.zip", rename_exe = { "swiftlint" = "swiftlint-dynamic", "swiftlint-static" = "swiftlint" }, filter_bins = "swiftlint" }
platforms.macos-arm64 = { asset_pattern = "portable_swiftlint.zip" }
platforms.macos-x64 = { asset_pattern = "portable_swiftlint.zip" }

[settings]
# Install only what mise.lock records, so a new release cannot change a check's result.
lockfile = true
locked = true
lockfile_platforms = ["macos-arm64", "macos-x64", "linux-x64", "linux-arm64"]
